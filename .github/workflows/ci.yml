name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  modelo:
    name: modelo (Python, R, Octave, Fortran, Julia, hansl, SQL)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: toolchains numericos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-numpy r-base-core octave gfortran gretl sqlite3
          # Falha ALTO se algum nao instalou. Sem isto a suite PULARIA a
          # implementacao e passaria verde tendo comparado menos.
          python3 -c 'import numpy; print("numpy", numpy.__version__)'
          Rscript --version
          octave --version | head -1
          gfortran -dumpversion
          gretlcli --version </dev/null | head -1
          sqlite3 --version

      - name: Julia
        # A action oficial poe o `julia` no PATH, e e por isso que o
        # `julia/roda.sh` procura o PATH ANTES de ~/ferramentas: num runner
        # bem configurado e o PATH que deve ganhar.
        #
        # A versao e "1" -- a ultima estavel da serie 1.x -- e nao um numero
        # fixo. Fixar daria reprodutibilidade e esconderia justamente o que
        # este projeto mede: se uma versao nova do LAPACK mudar a ordem das
        # somas, o CI deve mostrar isso, nao congelar o passado.
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: a suite, em modo exigente
        # P05_EXIGE=1 transforma "pulado" em FALHA: no CI, uma implementacao
        # ausente significa que a comparacao cobriu menos do que diz.
        env:
          P05_EXIGE: '1'
        run: ./verifica.sh

      - name: a tabela de divergencia, no log
        # Nao e teste: e o RESULTADO do projeto. Deixa-lo no log de cada
        # execucao e o que permite ver se a divergencia mudou com uma versao
        # nova de BLAS ou de compilador -- que e informacao, nao ruido.
        run: python3 compara.py
